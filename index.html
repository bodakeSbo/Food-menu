<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Bodake's Kitchen</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f4f4;
  color:#333;
}

header{
  background:#ff5722;
  color:white;
  padding:20px;
  text-align:center;
  box-shadow:0 2px 5px rgba(0,0,0,0.2);
}

.container{
  width:90%;
  max-width:1100px;
  margin:auto;
  padding:20px 0;
}

.menu{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 3px 10px rgba(0,0,0,0.15);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.card-content{
  padding:15px;
  text-align:center;
}

.card h3{
  margin-bottom:10px;
}

.price{
  color:#ff5722;
  font-size:20px;
  margin-bottom:10px;
}

button{
  background:#ff5722;
  color:white;
  border:none;
  padding:10px 15px;
  border-radius:6px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#e64a19;
}

button:disabled{
  opacity:0.7;
  cursor:not-allowed;
}

.order-box{
  margin-top:40px;
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.order-box h2{
  margin-bottom:20px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  padding:10px;
  background:#fafafa;
  border-radius:6px;
}

.total{
  margin-top:15px;
  font-size:20px;
  font-weight:bold;
}

input,
textarea{
  width:100%;
  padding:12px;
  margin-top:12px;
  border:1px solid #ccc;
  border-radius:6px;
}

.submit-btn{
  width:100%;
  margin-top:15px;
  font-size:18px;
}

.status-message{
  margin-top:15px;
  font-weight:bold;
}

.success{
  color:green;
}

.pending{
  color:#d97706;
}

.cancelled{
  color:#c62828;
}

.remove-btn{
  background:red;
  padding:6px 10px;
}

.empty{
  color:#777;
  margin-bottom:15px;
}

</style>
</head>

<body>

<header>

  <img
    src="https://res.cloudinary.com/djjqri13t/image/upload/v1779580587/image_20260524_015540e7e0eeb0-5621-425f-96b9-d5262b2ca5ac_mlta57.png"
    alt="Bodake's Kitchen Logo"
    style="max-width:50%; height:auto; display:block; margin:0 auto;"
  >

  <h1>🍔 Bodake's Kitchen</h1>
  <p>Fresh Food Delivered Fast</p>

</header>

<div class="container">

  <div class="menu">

    <!-- BURGER -->
    <div class="card">

      <img
        src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600"
        alt="Burger"
      >

      <div class="card-content">

        <h3>Burger</h3>

        <div class="price">
          ₹199
        </div>

        <button
          type="button"
          onclick="addToCart('Burger',199)"
        >
          Add to Cart
        </button>

      </div>

    </div>


    <!-- PIZZA -->
    <div class="card">

      <img
        src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=600"
        alt="Pizza"
      >

      <div class="card-content">

        <h3>Pizza</h3>

        <div class="price">
          ₹299
        </div>

        <button
          type="button"
          onclick="addToCart('Pizza',299)"
        >
          Add to Cart
        </button>

      </div>

    </div>


    <!-- PASTA -->
    <div class="card">

      <img
        src="https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?w=600"
        alt="Pasta"
      >

      <div class="card-content">

        <h3>Pasta</h3>

        <div class="price">
          ₹249
        </div>

        <button
          type="button"
          onclick="addToCart('Pasta',249)"
        >
          Add to Cart
        </button>

      </div>

    </div>

  </div>


  <!-- ORDER SECTION -->
  <div class="order-box">

    <h2>Your Order</h2>

    <div id="cartContainer">

      <p class="empty">
        Cart is empty
      </p>

    </div>

    <div
      class="total"
      id="totalPrice"
    >
      Total: ₹0
    </div>


    <form id="orderForm">

      <input
        type="text"
        id="username"
        placeholder="Your Name"
        required
      >

      <input
        type="tel"
        id="mobile"
        placeholder="Mobile Number"
        required
      >

      <textarea
        id="location"
        rows="4"
        placeholder="Delivery Address"
        required
      ></textarea>

      <button
        class="submit-btn"
        type="submit"
      >
        Proceed to Payment
      </button>

    </
