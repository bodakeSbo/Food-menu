<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  Bodake's Kitchen
</title>


<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f4f4;
  color:#333;
}

header{
  background:#ff5722;
  color:white;
  padding:20px;
  text-align:center;
  box-shadow:0 2px 5px rgba(0,0,0,0.2);
}

.container{
  width:90%;
  max-width:1100px;
  margin:auto;
  padding:20px 0;
}

.menu{
  display:grid;
  grid-template-columns:
    repeat(
      auto-fit,
      minmax(250px,1fr)
    );
  gap:20px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:
    0 3px 10px rgba(0,0,0,0.15);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.card-content{
  padding:15px;
  text-align:center;
}

.card h3{
  margin-bottom:10px;
}

.price{
  color:#ff5722;
  font-size:20px;
  margin-bottom:10px;
}

button{
  background:#ff5722;
  color:white;
  border:none;
  padding:10px 15px;
  border-radius:6px;
  cursor:pointer;
}

button:hover{
  background:#e64a19;
}

button:disabled{
  opacity:0.7;
  cursor:not-allowed;
}

.order-box{
  margin-top:40px;
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:
    0 3px 10px rgba(0,0,0,0.1);
}

.order-box h2{
  margin-bottom:20px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  padding:10px;
  background:#fafafa;
  border-radius:6px;
}

.total{
  margin-top:15px;
  font-size:20px;
  font-weight:bold;
}

input,
textarea{
  width:100%;
  padding:12px;
  margin-top:12px;
  border:1px solid #ccc;
  border-radius:6px;
}

.submit-btn{
  width:100%;
  margin-top:15px;
  font-size:18px;
}

.status-message{
  margin-top:15px;
  font-weight:bold;
}

.success{
  color:green;
}

.pending{
  color:#d97706;
}

.cancelled{
  color:#c62828;
}

.remove-btn{
  background:red;
  padding:6px 10px;
}

.empty{
  color:#777;
  margin-bottom:15px;
}

</style>

</head>


<body>


<header>

  <img
    src="https://res.cloudinary.com/djjqri13t/image/upload/v1779580587/image_20260524_015540e7e0eeb0-5621-425f-96b9-d5262b2ca5ac_mlta57.png"
    alt="Bodake's Kitchen Logo"
    style="
      max-width:50%;
      height:auto;
      display:block;
      margin:0 auto;
    "
  >

  <h1>
    🍔 Bodake's Kitchen
  </h1>

  <p>
    Fresh Food Delivered Fast
  </p>

</header>


<div class="container">


  <div class="menu">


    <!-- BURGER -->

    <div class="card">

      <img
        src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600"
        alt="Burger"
      >

      <div class="card-content">

        <h3>
          Burger
        </h3>

        <div class="price">
          ₹199
        </div>

        <button
          onclick="
            addToCart(
              'Burger',
              199
            )
          "
        >
          Add to Cart
        </button>

      </div>

    </div>


    <!-- PIZZA -->

    <div class="card">

      <img
        src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=600"
        alt="Pizza"
      >

      <div class="card-content">

        <h3>
          Pizza
        </h3>

        <div class="price">
          ₹299
        </div>

        <button
          onclick="
            addToCart(
              'Pizza',
              299
            )
          "
        >
          Add to Cart
        </button>

      </div>

    </div>


    <!-- PASTA -->

    <div class="card">

      <img
        src="https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?w=600"
        alt="Pasta"
      >

      <div class="card-content">

        <h3>
          Pasta
        </h3>

        <div class="price">
          ₹249
        </div>

        <button
          onclick="
            addToCart(
              'Pasta',
              249
            )
          "
        >
          Add to Cart
        </button>

      </div>

    </div>


  </div>


  <!-- ORDER SECTION -->

  <div class="order-box">


    <h2>
      Your Order
    </h2>


    <div id="cartContainer">

      <p class="empty">
        Cart is empty
      </p>

    </div>


    <div
      class="total"
      id="totalPrice"
    >
      Total: ₹0
    </div>


    <form id="orderForm">


      <input
        type="text"
        id="username"
        placeholder="Your Name"
        required
      >


      <input
        type="tel"
        id="mobile"
        placeholder="Mobile Number"
        required
      >


      <textarea
        id="location"
        rows="4"
        placeholder="Delivery Address"
        required
      ></textarea>


      <button
        class="submit-btn"
        type="submit"
      >
        Proceed to Payment
      </button>


    </form>


    <p
      class="status-message"
      id="successMessage"
    ></p>


  </div>


</div>


<script>


/* =========================
   BACKEND
========================= */

const BACKEND_BASE_URL =
  "https://food-menu-backend-5z12.onrender.com";

const BACKEND_URL =
  `${BACKEND_BASE_URL}/order`;


/* =========================
   CART
========================= */

let cart = [];


function addToCart(
  name,
  price
){

  const existing =
    cart.find(
      item =>
        item.name === name
    );


  if(existing){

    existing.qty += 1;

  } else {

    cart.push({

      name:
        name,

      price:
        price,

      qty:
        1

    });

  }


  renderCart();

}


/* =========================
   REMOVE ITEM
========================= */

function removeItem(name){

  cart =
    cart.filter(
      item =>
        item.name !== name
    );


  renderCart();

}


/* =========================
   RENDER CART
========================= */

function renderCart(){

  const container =
    document.getElementById(
      "cartContainer"
    );


  const totalElement =
    document.getElementById(
      "totalPrice"
    );


  container.innerHTML =
    "";


  if(
    cart.length === 0
  ){

    container.innerHTML =
      '<p class="empty">Cart is empty</p>';


    totalElement.innerText =
      "Total: ₹0";


    return;

  }


  let total = 0;


  cart.forEach(
    item => {

      total +=
        item.price *
        item.qty;


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "cart-item";


      div.innerHTML = `

        <div>

          <strong>
            ${item.name}
          </strong>

          <br>

          ₹${item.price}
          ×
          ${item.qty}

        </div>


        <div>

          ₹${item.price * item.qty}

          <button
            class="remove-btn"
            onclick="
              removeItem(
                '${item.name}'
              )
            "
          >
            X
          </button>

        </div>

      `;


      container.appendChild(
        div
      );

    }
  );


  totalElement.innerText =
    `Total: ₹${total}`;

}


/* =========================
   START PAYMENT
========================= */

document
.getElementById(
  "orderForm"
)
.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    if(
      cart.length === 0
    ){

      alert(
        "Please add items"
      );

      return;

    }


    const name =
      document
        .getElementById(
          "username"
        )
        .value
        .trim();


    const mobile =
      document
        .getElementById(
          "mobile"
        )
        .value
        .trim();


    const location =
      document
        .getElementById(
          "location"
        )
        .value
        .trim();


    if(
      mobile.length < 10
    ){

      alert(
        "Invalid mobile number"
      );

      return;

    }


    const button =
      document.querySelector(
        ".submit-btn"
      );


    button.innerText =
      "Opening payment...";

    button.disabled =
      true;


    try{


      const response =
        await fetch(
          BACKEND_URL,
          {

            method:
              "POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                customer:{

                  name:
                    name,

                  mobile:
                    mobile,

                  location:
                    location

                },

                cart:
                  cart

              })

          }
        );


      const data =
        await response.json();


      if(
        response.ok &&
        data.checkoutUrl
      ){

        /*
         * The order is NOT confirmed here.
         *
         * We only redirect the customer
         * to Stripe.
         */

        window.location.href =
          data.checkoutUrl;

        return;

      }


      alert(
        data.message ||
        "Unable to start payment"
      );


    } catch(error){


      console.error(
        "Payment error:",
        error
      );


      alert(
        "Unable to connect to payment server"
      );


    } finally {


      button.innerText =
        "Proceed to Payment";


      button.disabled =
        false;


    }

  }
);


/* =========================
   PAYMENT RETURN
========================= */

const urlParams =
  new URLSearchParams(
    window.location.search
  );


const paymentStatus =
  urlParams.get(
    "payment"
  );


const sessionId =
  urlParams.get(
    "session_id"
  );


const messageElement =
  document.getElementById(
    "successMessage"
  );


/* =========================
   SUCCESS RETURN
========================= */

/*
 * IMPORTANT:
 *
 * "?payment=success"
 * DOES NOT itself mean the order
 * is confirmed.
 *
 * The frontend asks the backend.
 */

if(
  paymentStatus === "success" &&
  sessionId
){

  messageElement.className =
    "status-message pending";


  messageElement.innerText =
    "⏳ Payment received. Confirming your order...";


  let attempts = 0;

  const MAX_ATTEMPTS = 15;


  async function checkOrderStatus(){

    attempts += 1;


    try{


      const response =
        await fetch(

          `${BACKEND_BASE_URL}/order-status` +
          `?session_id=` +
          encodeURIComponent(
            sessionId
          )

        );


      const data =
        await response.json();


      /*
       * ONLY THIS condition displays
       * "Payment successful".
       */

      if(
        response.ok &&
        data.payment_status ===
          "paid" &&
        data.order_status ===
          "confirmed"
      ){

        messageElement.className =
          "status-message success";


        messageElement.innerText =
          "✅ Payment successful! Your order has been confirmed.";


        cart = [];


        renderCart();


        /*
         * Remove payment parameters
         * from the browser address.
         *
         * This prevents the old success
         * message appearing again after
         * a later refresh.
         */

        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );


        return;

      }


      /*
       * Webhook may take a few seconds.
       */

      if(
        attempts <
        MAX_ATTEMPTS
      ){

        setTimeout(
          checkOrderStatus,
          2000
        );

      } else {

        messageElement.className =
          "status-message pending";


        messageElement.innerText =
          "Payment verification is taking longer than expected. Please check your order status.";

      }


    } catch(error){


      console.error(
        "Order verification error:",
        error
      );


      if(
        attempts <
        MAX_ATTEMPTS
      ){

        setTimeout(
          checkOrderStatus,
          2000
        );

      } else {

        messageElement.className =
          "status-message pending";


        messageElement.innerText =
          "Unable to verify the payment right now. Please check your order status.";

      }

    }

  }


  checkOrderStatus();

}


/* =========================
   CANCELLED PAYMENT
========================= */

if(
  paymentStatus ===
  "cancelled"
){

  messageElement.className =
    "status-message cancelled";


  messageElement.innerText =
    "Payment was cancelled. Your order was not confirmed.";


  /*
   * Remove payment parameter so
   * this message does not remain
   * forever after refresh.
   */

  window.history.replaceState(
    {},
    document.title,
    window.location.pathname
  );

}


</script>


</body>

</html>
